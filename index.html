/* ===== Supabase: caricamento e sincronizzazione ===== */
const TABLES=['tasks','events','files','notes','meetings'];
async function load(){
 const names=['profiles',...TABLES,'folders'];
 const res=await Promise.all(names.map(n=>sb.from(n).select('*')));
 const err=res.find(r=>r.error);if(err)throw err.error;
 const [p,...rest]=res;S.users=p.data;
 TABLES.forEach((t,i)=>S[t]=rest[i].data);
 S.folders=rest[TABLES.length].data.map(x=>x.name).sort();
 HAS_ASG=!S.tasks.length||'asg' in S.tasks[0];S.tasks.forEach(t=>{t.c=t.c||[];t.asg=t.asg||[]});S.meetings.forEach(m=>{m.fixed=m.fixed||[];m.teams=m.teams||[]});
 last=clone(S);
}
async function boot(){
 if(!CLOUD){render();return}
 loading=true;render();
 const {data:{session}}=await sb.auth.getSession();
 if(!session){me=null;loading=false;render();return}
 try{await load();me=S.users.find(u=>u.id===session.user.id)||null;bootErr=me?'':'Profilo non trovato. Riprova tra qualche secondo o contatta il superadmin.'}
 catch(e){bootErr='Errore di connessione al database: '+e.message}
 loading=false;render();
}
let syncing=Promise.resolve();
function sync(){syncing=syncing.then(doSync);return syncing}
async function doSync(){
 const errs=[];const strip=(t,o)=>{if(t==='tasks'){const {c,...r}=o;if(!HAS_ASG)delete r.asg;return r}return o};
 for(const t of TABLES){
  const old=new Map(last[t].map(o=>[o.id,JSON.stringify(strip(t,o))])),now=new Map(S[t].map(o=>[o.id,o]));
  const up=S[t].filter(o=>old.get(o.id)!==JSON.stringify(strip(t,o))).map(o=>strip(t,o));
  const del=[...old.keys()].filter(id=>!now.has(id));
  if(up.length){const r=await sb.from(t).upsert(up);if(r.error)errs.push(r.error.message)}
  if(del.length){const r=await sb.from(t).delete().in('id',del);if(r.error)errs.push(r.error.message)}
 }

 if(nf.length){const r=await sb.from('folders').insert(nf.map(name=>({name})));if(r.error)errs.push(r.error.message)}
 const ou=new Map(last.users.map(u=>[u.id,u]));
 for(const u of S.users){const o=ou.get(u.id);if(!o)continue;
  if(o.role!==u.role){const r=await sb.from('profiles').update({role:u.role,team:u.team}).eq('id',u.id);if(r.error)errs.push(r.error.message)}
  else if(o.team!==u.team){const r=await sb.rpc('set_team',{uid:u.id,tm:u.team});if(r.error)errs.push(r.error.message)}}
 const gone=last.users.filter(u=>!S.users.find(x=>x.id===u.id)).map(u=>u.id);
 if(gone.length){const r=await sb.from('profiles').delete().in('id',gone);if(r.error)errs.push(r.error.message)}
 try{await load()}catch(e){errs.push(e.message)}
 if(me)me=S.users.find(u=>u.id===me.id)||me;
 if(errs.length)alert('Alcune modifiche non sono state salvate (permessi insufficienti o errore):\n'+errs.join('\n'));
 if(!modal)render();
}
if(CLOUD){sb.auth.onAuthStateChange(ev=>{

  if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(boot)});
 addEventListener('focus',()=>{if(me&&!modal)sync()});}
const U=id=>S.users.find(u=>u.id===id)||{name:'Da assegnare',ini:'?'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
const fmtL=d=>new Date(d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
const nid=a=>CLOUD?Date.now()*100+Math.floor(Math.random()*100):Math.max(0,...a.map(x=>x.id))+1;
const ini=n=>n.trim().split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase();

/* ================= PERMESSI ================= */
const isSA=()=>me.role==='superadmin', isLead=t=>me.role==='lead'&&me.team===t, inTeam=t=>me.team===t;
const can={
 create:()=>me.role!=='guest',
 edit:t=>isSA()||isLead(t.team)||t.own===me.id,
 assign:t=>isSA()||isLead(t.team),
 take:t=>!t.own&&inTeam(t.team)&&me.role==='member',
 del:t=>isSA()||isLead(t.team)||(t.req&&isLead(t.req)&&!t.own),
 comment:()=>me.role!=='guest',
 editC:c=>c.u===me.id,
 delC:c=>c.u===me.id||isSA(),
 users:()=>isSA(),
 manageTeam:k=>isSA()||isLead(k),
 event:e=>isSA()||(e?(e.team&&isLead(e.team)):me.role==='lead'),
 seeFile:f=>!f.team||isSA()||inTeam(f.team)||me.role!=='guest'&&f.shared,
 upload:()=>me.role!=='guest',
 delFile:f=>isSA()||f.by===me.id||(f.team&&isLead(f.team)),
 notes:()=>!!me.team||isSA(),
 meeting:()=>isSA()||me.role==='lead'};
const av=(u,team,cls='')=>{const T=TEAMS[team||u.team]||{c:'#666',bg:'#eee'};return `<div class="av ${cls}" style="background:${T.bg};color:${T.c}">${esc(u.ini)}</div>`};
const roleTag=r=>`<span class="role" style="background:${ROLES[r].bg};color:${ROLES[r].c}">${ROLES[r].l}</span>`;
const teamChip=k=>k?`<span class="chip" style="background:${TEAMS[k].bg};color:${TEAMS[k].c}"><span class="dot" style="background:${TEAMS[k].c}"></span>${TEAMS[k].name}</span>`:`<span class="chip" style="background:#f0f0f0;color:#444">Tutta la crew</span>`;
const inbox=()=>S.tasks.filter(t=>!t.own&&(isSA()||isLead(t.team))).length;
/* stato derivato dalle date (nessuna percentuale) */
const taskState=t=>{const n=iso(TODAY);return t.e<n?{k:'end',l:'Terminata',c:'#555',bg:'#eee'}:t.s>n?{k:'soon',l:'Da iniziare',c:'#1f5fb8',bg:'#e8f1fd'}:{k:'run',l:'In corso',c:'#1f7a5c',bg:'#e3f3ec'}};
const stChip=t=>{const s=taskState(t);return `<span class="chip" style="background:${s.bg};color:${s.c}">${s.l}</span>`};
/* owner o una delle altre persone coinvolte */
const isMine=t=>t.own===me.id||(t.asg||[]).includes(me.id);

function timeline(){

 return header('Pianificazione','Timeline di progetto',newTaskBtn())+stats()+`<div class="card">

function tasksView(){
 const tabs=[['mine','Assegnate a me',t=>isMine(t)],['team','Del mio team',t=>t.team===me.team],['inbox','Da assegnare',t=>!t.own&&(isSA()||t.team===me.team)],['sent','Richieste ad altri team',t=>t.req&&(isSA()||t.req===me.team)]];

  <div class="row2"><div class="f"><label>Ruolo</label><select id="nr">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k==='member'?'selected':''}>${r.l}</option>`).join('')}</select></div>
  <div class="f"><label>Team</label><select id="nt"><option value="">—</option>${Object.entries(TEAMS).map(([k,T])=>`<option value="${k}">${T.name}</option>`).join('')}</select></div></div>
  <div class="actions"><button class="btn ghost" onclick="closeM()">Annulla</button><button class="btn" onclick="newUser()">Crea e invita</button></div>`);
}

/* ================= AZIONI ================= */
function go(v){view=v;q='';render();scrollTo(0,0)}
function closeM(){modal=null;render()}
function openTask(id){if(!id&&!can.create())return;
 const t=id?JSON.parse(JSON.stringify(S.tasks.find(x=>x.id===id))):{t:'',team:me.team||'MK',req:null,own:me.role==='member'?me.id:null,s:iso(TODAY),e:iso(new Date(TODAY.getTime()+14*864e5)),p:0,dep:null,asg:[],c:[]};
 modal={type:'task',t};render()}
function collect(){const t=modal.t,g=id=>document.getElementById(id);
 if(g('ft'))t.t=g('ft').value;if(g('fown'))t.own=g('fown').value||null;if(g('fs'))t.s=g('fs').value;if(g('fe'))t.e=g('fe').value;if(g('fdep'))t.dep=g('fdep').value?+g('fdep').value:null;if(g('fasgbox'))t.asg=[...document.querySelectorAll('.fasg:checked')].map(i=>i.value).filter(v=>v!==t.own);if(g('fc'))modal.draft=g('fc').value}
function saveTask(){collect();const t=modal.t;if(!t.t.trim())return alert('Inserisci un titolo');if(t.e<t.s)return alert('La scadenza precede l\'inizio');
 if(!t.id&&me.team&&t.team!==me.team){t.req=me.team;t.own=null;t.asg=[]}
 if(!t.own&&(t.asg||[]).length)return alert('Scegli un owner prima di aggiungere altre persone.');
 if(!t.id){t.id=nid(S.tasks);S.tasks.push(t)}
 else S.tasks[S.tasks.findIndex(x=>x.id===t.id)]=t;save();closeM()}
function takeTask(){const o=S.tasks.find(x=>x.id===modal.t.id);o.own=me.id;o.asg=(o.asg||[]).filter(id=>id!==me.id);save();closeM()}
function delTask(){if(!confirm('Eliminare questa task?'))return;S.tasks=S.tasks.filter(x=>x.id!==modal.t.id);S.tasks.forEach(x=>{if(x.dep===modal.t.id)x.dep=null});save();closeM()}
async function addComment(){const v=fc.value.trim();if(!v)return;collect();const o=S.tasks.find(x=>x.id===modal.t.id);
 if(CLOUD){const r=await sb.rpc('add_comment',{tid:o.id,txt:v});if(r.error)return alert(r.error.message);const lt=last.tasks.find(x=>x.id===o.id);o.c.push({u:me.id,x:v});if(lt)lt.c=clone(o.c);modal.t.c=o.c;modal.draft='';render();return}
 o.c.push({u:me.id,x:v});modal.t.c=o.c;modal.draft='';save();render()}
function commentHtml(c,i){
 if(modal.editC===i)return `<div class="cm"><small>${esc(U(c.u).name)}</small><textarea id="fce" style="margin-top:6px">${esc(c.x)}</textarea><div class="cmx"><button onclick="modal.editC=null;render()">Annulla</button><button class="btn sm" onclick="saveComment(${i})">Salva</button></div></div>`;
 const ed=can.editC(c),dl=can.delC(c);
 return `<div class="cm"><small>${esc(U(c.u).name)}${c.edited?' · modificato':''}</small><div>${esc(c.x)}</div>${ed||dl?`<div class="cmx">${ed?`<button onclick="editComment(${i})">Modifica</button>`:''}${dl?`<button class="del" onclick="delComment(${i})">Elimina</button>`:''}</div>`:''}</div>`}
function editComment(i){collect();modal.editC=i;render();setTimeout(()=>{const e=document.getElementById('fce');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}})}
async function saveComment(i){const v=document.getElementById('fce').value.trim();if(!v)return alert('Il commento non può essere vuoto.');collect();
 const o=S.tasks.find(x=>x.id===modal.t.id),c=o.c[i];if(!c||!can.editC(c))return;
 if(v!==c.x){if(CLOUD){const r=await sb.rpc('edit_comment',{tid:o.id,idx:i,old_txt:c.x,new_txt:v});if(r.error)return alert(r.error.message)}c.x=v;c.edited=true}
 const lt=CLOUD&&last.tasks.find(x=>x.id===o.id);if(lt)lt.c=clone(o.c);modal.t.c=o.c;modal.editC=null;if(!CLOUD)save();render()}
async function delComment(i){if(!confirm('Eliminare questo commento?'))return;collect();
 const o=S.tasks.find(x=>x.id===modal.t.id),c=o.c[i];if(!c||!can.delC(c))return;
 if(CLOUD){const r=await sb.rpc('delete_comment',{tid:o.id,idx:i,old_txt:c.x});if(r.error)return alert(r.error.message)}
 o.c.splice(i,1);const lt=CLOUD&&last.tasks.find(x=>x.id===o.id);if(lt)lt.c=clone(o.c);modal.t.c=o.c;modal.editC=null;if(!CLOUD)save();render()}
function openEvent(id,d){const e=id?{...S.events.find(x=>x.id===id)}:{t:'',d:d||iso(TODAY),h:'18:30',where:'',team:isSA()?null:me.team,desc:''};if(!id&&!can.event())return;modal={type:'event',e};render()}
function saveEvent(){const e=modal.e;Object.assign(e,{t:et.value.trim(),d:ed.value,h:eh.value,where:ew.value,team:etm.value||null,desc:eds.value});if(!e.t)return alert('Inserisci un titolo');
 if(e.id)S.events[S.events.findIndex(x=>x.id===e.id)]=e;else{e.id=nid(S.events);S.events.push(e)}save();closeM()}
async function uploadFile(){const f=uf.files[0],l=ul.value.trim();if(!f&&!l)return alert('Seleziona un file o inserisci un link');
 let url=l||null;
 if(f&&CLOUD){if(f.size>50e6)return alert('Massimo 50 MB per file.');
  const path=`${uv.value||'ALL'}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;
  const r=await sb.storage.from('files').upload(path,f);if(r.error)return alert('Caricamento non riuscito: '+r.error.message);url='sb:'+path}
 S.files.unshift({id:nid(S.files),n:f?f.name:l.split('/').pop()||'Link',url,f:ufo.value,team:uv.value||null,by:me.id,d:iso(TODAY),sz:f?(f.size>1e6?(f.size/1e6).toFixed(1).replace('.',',')+' MB':Math.ceil(f.size/1e3)+' KB'):'link'});save();closeM()}
function saveMeeting(){const t=mt.value.trim();if(!t)return alert('Inserisci un titolo');const teams=[...document.querySelectorAll('.mtm:checked')].map(i=>i.value);if(!teams.length)return alert('Scegli almeno un team');
 const ev={id:nid(S.events),t,d:md.value,h:mh.value,where:mw.value,team:teams.length===1?teams[0]:null,desc:'Meeting'};S.events.push(ev);
 const m={id:nid(S.meetings),t,ev:ev.id,teams,fixed:[],order:[]};S.meetings.push(m);selMeeting=m.id;save();closeM()}
function addMember(){if(mu.value){S.users.find(u=>u.id===mu.value).team=modal.team}else if(mn.value.trim()&&me2.value.trim()){if(CLOUD)return invite(mn.value.trim(),me2.value.trim(),'member',modal.team);S.users.push({id:'u'+Date.now(),name:mn.value.trim(),ini:ini(mn.value),email:me2.value.trim(),role:'member',team:modal.team})}else return alert('Scegli un utente o inserisci nome ed email');save();closeM()}
function removeFromTeam(id){const u=S.users.find(x=>x.id===id);if(confirm('Rimuovere '+u.name+' dal team?')){u.team=null;save();render()}}
function setUser(id,k,v){const u=S.users.find(x=>x.id===id);u[k]=v;if(k==='role'&&['guest','superadmin'].includes(v))u.team=null;save();render()}
function delUser(id){if(!confirm('Eliminare l\'utente?'))return;S.users=S.users.filter(u=>u.id!==id);save();render()}
function newUser(){const n=nn2.value.trim(),e=ne.value.trim();if(!n||!e)return alert('Nome ed email obbligatori');
 if(CLOUD)return invite(n,e,nr.value,['guest','superadmin'].includes(nr.value)?null:(nt.value||null));
 S.users.push({id:'u'+Date.now(),name:n,ini:ini(n),email:e,role:nr.value,team:['guest','superadmin'].includes(nr.value)?null:(nt.value||null)});save();closeM()}
boot();
</script>
