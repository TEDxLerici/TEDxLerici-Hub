function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)}
const ld=s=>new Date(s+'T00:00:00');
const MES=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const TL_END=new Date(2029,0,1);let tlPast=false;
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function tlStart(){let a=sod(TODAY);if(tlPast)S.tasks.forEach(t=>{const d=ld(t.s);if(d<a)a=d});return a}
function ganttCells(sc,st){const end=TL_END,ppd={w:10,m:3.7,q:3}[sc]||3.7,cells=[];
 const push=(a,b,l,sub)=>cells.push({l,sub,w:Math.round((b-a)/864e5*ppd*10)/10});
 const first=st.getTime();
 if(sc==='q'){let a=new Date(st);while(a<end){const q=Math.floor(a.getMonth()/3),b=new Date(a.getFullYear(),q*3+3,1);push(a,b>end?end:b,'Q'+(q+1),String(a.getFullYear()));a=b}}
 else if(sc==='w'){let a=new Date(st);while(a<end){const b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+8-(a.getDay()||7));const e=b>end?end:b;
  push(a,e,'W'+isoWeek(a),a.getDate()+' '+MES[a.getMonth()].toLowerCase()+((a.getMonth()===0&&a.getDate()<=7)||a.getTime()===first?' '+a.getFullYear():''));a=b}}
 else{let a=new Date(st);while(a<end){const b=new Date(a.getFullYear(),a.getMonth()+1,1);push(a,b>end?end:b,MES[a.getMonth()],a.getMonth()===0||a.getTime()===first?String(a.getFullYear()):'');a=b}}
 return {cells,ppd,total:cells.reduce((t,c)=>t+c.w,0)}}
function scrollToday(){const g=document.querySelector('.gantt');if(g)g.scrollTo({left:0,behavior:'smooth'})}
function setScale(sc){scale=sc;render();const g=document.querySelector('.gantt');if(g&&g.dataset.today)g.scrollLeft=Math.max(0,+g.dataset.today-40)}
function timeline(){
 const st=tlStart(),t0=sod(TODAY),past=S.tasks.filter(t=>ld(t.e)<t0).length;
 const vis=S.tasks.filter(t=>filt[t.team]&&t.t.toLowerCase().includes(q.toLowerCase())&&(tlPast||ld(t.e)>=t0));
 const {cells,ppd,total}=ganttCells(scale,st),x=d=>(((typeof d==='string'?ld(d):d)-st)/864e5)*ppd,td=x(t0);
 const bar=t=>{const l=Math.min(Math.max(x(t.s),0),total-40),w=Math.max(Math.min(x(t.e)+ppd,total)-l,40),o=t.own?U(t.own):null;
  return `<div class="gbar ${t.req?'ext':''}" style="left:${l}px;width:${w}px;background-color:${TEAMS[t.team].c}" title="${esc(tnum(t)+' '+t.t+' — '+(o?o.name:'da assegnare')+' — '+fmt(t.s)+' → '+fmt(t.e)+' ('+days(t)+' g)')}" onclick="openTask(${t.id})"><span>${esc(t.t)}</span>${w>230?`<span class="bd">${days(t)} g${o?' · '+esc(o.ini||ini(o.name)):''}</span>`:''}</div>`};
 return header('Pianificazione','Timeline di progetto',newTaskBtn())+stats()+BODY+`<div class="card">
 <div class="tools"><input id="qs" placeholder="🔍 Cerca una task..." value="${esc(q)}" oninput="q=this.value;render();setTimeout(()=>{qs.focus();qs.setSelectionRange(99,99)})">
 <div class="tlr"><button class="btn ghost sm" onclick="scrollToday()">Oggi</button>${past?`<label class="tlp"><input type="checkbox" ${tlPast?'checked':''} onchange="tlPast=this.checked;render()">Mostra anche le concluse (${past})</label>`:''}<div class="seg"><button class="${scale==='w'?'on':''}" onclick="setScale('w')">Settimane</button><button class="${scale==='m'?'on':''}" onclick="setScale('m')">Mesi</button><button class="${scale==='q'?'on':''}" onclick="setScale('q')">Trimestri</button></div></div></div>
 <div class="gantt" data-today="${td>=0&&td<=total?Math.round(td):''}"><div class="gl"><div class="gh">ATTIVITÀ<span class="gh2">&nbsp;· OWNER · DURATA</span></div>${vis.map(ganttRow).join('')||'<div class="empty">Nessuna task.</div>'}</div>
 <div class="gr"><div style="width:${total}px"><div class="months">${cells.map(c=>`<div style="flex:0 0 ${c.w}px" title="${c.l}${c.sub?' · dal '+c.sub:''}"><span style="text-align:center;line-height:1.35">${c.w>=26?c.l:''}${c.sub&&c.w>=60?`<br><small style="letter-spacing:0;opacity:.8">${c.sub}</small>`:''}</span></div>`).join('')}</div>
 <div class="lanes"><div class="gridl">${cells.map(c=>`<i style="flex:0 0 ${c.w}px"></i>`).join('')}</div>${td>=0&&td<=total?`<div class="evl" style="left:${td}px;border-left:2px solid var(--info-c)" title="Oggi"></div>`:''}<div class="evl" style="left:${x(mainDate())}px"></div>${vis.map(t=>`<div class="lane">${bar(t)}</div>`).join('')}</div></div></div></div>
 <div class="foot"><span>▨ Barra a righe = richiesta da un altro team</span><span style="color:var(--info-c)">│ Oggi</span><span style="color:var(--red)">┆ Data evento</span><span>Da oggi a dicembre 2028 · settimane numerate secondo lo standard ISO</span><span style="margin-left:auto">● stato: verde in corso · blu da iniziare · grigio terminata</span></div></div>`}

function parseCSV(t){t=String(t).replace(/^﻿/,'');const first=t.split(/\r?\n/)[0]||'';
 const cnt=ch=>{let n=0,q=false;for(const c of first){if(c==='"')q=!q;else if(!q&&c===ch)n++}return n};
 const best=[';','\t',','].map(d=>[d,cnt(d)]).sort((a,b)=>b[1]-a[1])[0],D=best[1]?best[0]:';';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;
  else if(c===D){row.push(cur);cur=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
  else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}
 return {delim:D,rows:rows.filter(r=>r.some(x=>String(x).trim()!==''))}}
function toNum(s){s=String(s??'').replace(/[€%\s ]/g,'');if(!s)return '';
 if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
 else if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
 else if(s.includes(','))s=s.replace(',','.');
 const n=Number(s);return isNaN(n)?'':n}
function toDate(s){s=String(s??'').trim();let y,mo,d,m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
 else if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12){const x=d;d=mo;mo=x}}
 else return '';
 const t=new Date(y,mo-1,d);return t.getFullYear()===y&&t.getMonth()===mo-1&&t.getDate()===d?iso(t):''}
function convCell(c,v){v=String(v??'').trim();if(!v)return '';
 if(c.t==='num'||c.t==='eur')return toNum(v);
 if(c.t==='date')return toDate(v);
 if(c.t==='sel'){const o=(c.o||[]).find(x=>normH(x)===normH(v));return o||v}
 if(c.t==='person'){const n=normH(v),u=S.users.find(x=>x.role!=='guest'&&(String(x.id)===v||normH(x.name)===n||(x.email||'').toLowerCase()===v.toLowerCase()));return u?u.id:''}
 return v}
function guessType(vals){const v=vals.map(x=>String(x??'').trim()).filter(Boolean);if(!v.length)return 'text';
 if(v.every(x=>toDate(x)))return 'date';if(v.every(x=>toNum(x)!==''))return 'num';return 'text'}
function autoMap(heads,key){const cols=colsOf(key),al=ALIAS[key]||{},used=new Set(),map=heads.map(()=>null);
 const names=c=>[normH(c.l),normH(c.k),...((al[c.k]||[]).map(normH))];
 heads.forEach((h,i)=>{const n=normH(h);if(!n)return;const c=cols.find(c=>!used.has(c.k)&&names(c).includes(n));if(c){map[i]=c.k;used.add(c.k)}});
 heads.forEach((h,i)=>{if(map[i]!==null)return;const n=normH(h);if(!n)return;const c=cols.find(c=>!used.has(c.k)&&names(c).some(a=>a.length>=3&&(n.includes(a)||a.includes(n))));if(c){map[i]=c.k;used.add(c.k)}});
 return map.map(m=>m===null?((!CLOUD||HAS_COLS)?'__new':''):m)}
function pickCsv(inp,key){const f=inp.files[0];inp.value='';if(!f)return;if(f.size>5e6)return alert('File troppo grande (max 5 MB).');
 const rd=new FileReader();rd.onload=()=>{let txt;const buf=rd.result;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{txt=new TextDecoder('windows-1252').decode(buf)}catch(e2){txt=String.fromCharCode(...new Uint8Array(buf))}}
  csvFromText(key,txt,f.name)};rd.readAsArrayBuffer(f)}
function csvFromText(key,txt,fname){const sh=SHEETS[key];if(!sh||!teamAccess(sh.team))return;

function runImport(){const m=modal,key=m.key,sh=SHEETS[key];if(!m||m.type!=='csvimp'||!teamAccess(sh.team))return;

 if(m.mode==='replace'&&!confirm('Sostituire TUTTE le righe attuali del foglio con quelle del file?\nL\'operazione non si può annullare.'))return;
 const ng=idGen(S.sheet_cols),newCols=[];let cols=colsOf(key).map(c=>({...c}));
 const colFor=m.map.map((v,i)=>{if(v==='__new'){const samples=data.map(r=>r[i]),t=guessType(samples);let l=String(heads[i]||'').trim().slice(0,60)||('Colonna '+(i+1));
   const ex=cols.find(c=>normH(c.l)===normH(l));if(ex)return ex;const id=ng(),row={id,sheet:key,team:sh.team,kind:'add',k:'c'+id,l,t,o:[]};newCols.push(row);const c={k:row.k,l,t,o:[],custom:id};cols.push(c);return c}
  return v?cols.find(c=>c.k===v)||null:null});
 const mapped=new Set(colFor.filter(Boolean).map(c=>c.k)),fixed={};
 cols.forEach(c=>{if(!mapped.has(c.k)&&m.fixed[c.k])fixed[c.k]=c.t==='num'||c.t==='eur'?toNum(m.fixed[c.k]):m.fixed[c.k]});
 const rg=idGen(S.sheet_rows),rows=[];let skipped=0;
 data.forEach(r=>{if(!r.some(x=>String(x).trim()!==''))return;const d={...fixed};colFor.forEach((c,i)=>{if(c)d[c.k]=convCell(c,r[i])});
  if(!Object.values(d).some(v=>v!==''&&v!=null)){skipped++;return}rows.push({id:rg(),sheet:key,team:sh.team,d})});

  if(oldIds)S.sheet_rows=S.sheet_rows.filter(x=>!oldIds.has(x.id));
  rows.forEach(r=>{if(!S.sheet_rows.some(x=>x.id===r.id))S.sheet_rows.push(r)})});

async function notifyEvent(ev,teams,opt){opt=opt||{};
 if(!CLOUD)return alert('Modalità demo: l\'evento è salvato, ma nessuna email viene inviata.');
 const upd=!!opt.update;
 try{const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('sessione scaduta, rientra nell\'app');
  const r=await fetch('/api/send-event',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},
   body:JSON.stringify({event:{id:ev.id,t:ev.t,d:ev.d,h:ev.h,h2:ev.h2||'',where:ev.where,mode:ev.mode,link:ev.link,desc:ev.desc,team:ev.team},teams:teams||evTeams(ev),people:ev.people||[],emails:ev.emails||[],update:upd,changes:opt.changes||[]})});
  const j=await r.json().catch(()=>({}));
  if(r.ok)alert(`${upd?'Aggiornamento inviato':'Email inviata'} a ${j.sent} ${j.sent===1?'persona':'persone'}${j.failed?` (${j.failed} non consegnate)`:''}.`+((j.names&&j.names.length)?`\n\nDestinatari: ${j.names.slice(0,12).join(', ')}${j.names.length>12?' e altri '+(j.names.length-12):''}.`:'')+((j.senzaEmail&&j.senzaEmail.length)?`\n\nSenza email nel profilo (non raggiunti): ${j.senzaEmail.join(', ')}.`:'')+(j.promemoria==='inviato'?'\n\nTi ho mandato anche il promemoria dell\'evento.':j.promemoria==='fallito'?'\n\nIl promemoria per te non è stato consegnato.':'\n\nIl promemoria per te non è partito: nel tuo profilo non c\'è un\'email.')+(j.failed&&j.reason?`\n\nMotivo indicato dal servizio email:\n${j.reason}`+(/only send|own email|verify a domain|testing emails/i.test(j.reason)?'\n\nCon il mittente di prova si può scrivere solo al proprio indirizzo: verifica un dominio su Resend e cambia MAIL_FROM.':''):''));
  else if(r.status===501)alert('Evento salvato, ma l\'invio email non è ancora configurato (serve la chiave del servizio email su Vercel: vedi README).');
  else alert('Evento salvato, ma l\'email non è partita: '+(j.error||('errore '+r.status)))}
 catch(e){alert('Evento salvato, ma l\'email non è partita: '+e.message)}}

function buildPrompt(m,notes){const e=S.events.find(ev=>ev.id===m.ev),ag=agendaOf(m);
 const people=S.users.filter(u=>u.role!=='guest'&&u.team).map(u=>`- ${u.id} | ${u.name} | ${TEAMS[u.team].name} (${u.team}) | ${ROLES[u.role].l}`).join('\n')||'- (nessun membro nei team)';

 return `Sei l'assistente di TEDxLerici HUB. Leggi gli appunti della riunione e proponi le task da creare.

Regole:
- Proponi solo task che emergono davvero dagli appunti e non duplicare quelle già esistenti.
- Se responsabile o scadenza non sono nel testo, lasciali a null: non inventarli.
- Scegli owner e altre persone SOLO dall'elenco membri, usando l'id esatto.
- "team" è uno tra MK, OP, PA, SP (in genere il team dell'owner).
- Date nel formato AAAA-MM-GG. "reason" è una frase breve che cita gli appunti.

${ag.map((p,i)=>`${i+1}. ${p.x}`).join('\n')||'(vuoto)'}

${people}

TASK GIÀ ESISTENTI:
${tasks}

APPUNTI (tra i due ---):
---
${notes}
---

Rispondi SOLO con un blocco JSON, senza altro testo, in questo formato:
{"tasks":[{"title":"...","team":"MK","owner":"<id membro o null>","others":["<id membro>"],"start":"AAAA-MM-GG o null","end":"AAAA-MM-GG o null","reason":"..."}]}`}

function importSug(mid){const raw=(document.getElementById('cjson').value||'').trim();if(!raw)return alert('Incolla la risposta di Claude.');
 if(CLOUD&&!HAS_SUG)return alert('Per salvare i suggerimenti serve la migrazione SQL 002 (cartella db/migrations).');
 let data;try{const a=raw.search(/[\[{]/),open=raw[a],b=raw.lastIndexOf(open==='['?']':'}');data=JSON.parse(raw.slice(a,b+1))}catch(e){return alert('Non riesco a leggere la risposta: incolla solo il blocco JSON di Claude.')}
 const arr=Array.isArray(data)?data:data.tasks;if(!Array.isArray(arr)||!arr.length)return alert('Nessuna task trovata nella risposta.');
 const uid=v=>{if(!v)return null;v=String(v).trim();const u=S.users.find(x=>String(x.id)===v)||S.users.find(x=>x.name.toLowerCase()===v.toLowerCase());return u&&u.role!=='guest'?u.id:null};
 const dt=v=>{v=String(v||'');return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v))?v:null};
 let n=0,skip=0;
 arr.slice(0,40).forEach(it=>{const title=String((it&&it.title)||'').trim().slice(0,160);if(!title)return;
  if(S.suggestions.some(g=>g.meeting===mid&&g.status==='pending'&&g.title.toLowerCase()===title.toLowerCase())){skip++;return}

 if(!n)return alert(skip?'Questi suggerimenti sono già in attesa di approvazione.':'Nessun suggerimento valido nella risposta.');
 save();closeM();alert(n+' suggerimenti aggiunti, in attesa di approvazione. Nessuna task è stata creata.')}
