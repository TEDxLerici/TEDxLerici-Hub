const TABLES=['tasks','events','files','notes','meetings'];
async function load(){
 const names=['profiles',...TABLES,'folders'];
 const res=await Promise.all([...names.map(n=>sb.from(n).select('*')),sb.from('suggestions').select('*')]);
 const rs=res.pop();
 const err=res.find(r=>r.error);if(err)throw err.error;
 const [p,...rest]=res;S.users=p.data;
 TABLES.forEach((t,i)=>S[t]=rest[i].data);
 S.folders=rest[TABLES.length].data.map(x=>x.name).sort();
 HAS_SUG=!rs.error;S.suggestions=HAS_SUG?rs.data:[];
 HAS_ASG=!S.tasks.length||'asg' in S.tasks[0];HAS_NUM=!S.tasks.length||'num' in S.tasks[0];
 HAS_MIN=!S.meetings.length||'minutes' in S.meetings[0];HAS_PROF=!S.users.length||'phone' in S.users[0];
 S.tasks.forEach(t=>{t.c=t.c||[];t.asg=t.asg||[]});S.meetings.forEach(m=>{m.fixed=m.fixed||[];m.teams=m.teams||[];if(HAS_MIN)m.minutes=m.minutes||''});
 S.suggestions.forEach(x=>x.asg=x.asg||[]);
 last=clone(S);
}
async function boot(){
 if(!CLOUD){render();return}
 loading=true;render();
 const {data:{session}}=await sb.auth.getSession();
 if(!session){me=null;loading=false;render();return}
 try{await load();me=S.users.find(u=>u.id===session.user.id)||null;bootErr=me?'':'Profilo non trovato. Riprova tra qualche secondo o contatta il superadmin.'}
 catch(e){bootErr='Errore di connessione al database: '+e.message}
 loading=false;render();
}
let syncing=Promise.resolve();
function sync(){syncing=syncing.then(doSync);return syncing}
async function doSync(){
 const errs=[];const strip=(t,o)=>{if(t==='tasks'){const {c,...r}=o;if(!HAS_ASG)delete r.asg;if(!HAS_NUM)delete r.num;return r}if(t==='meetings'&&!HAS_MIN){const {minutes,...r}=o;return r}return o};
 for(const t of [...TABLES,...(HAS_SUG?['suggestions']:[])]){
  const old=new Map(last[t].map(o=>[o.id,JSON.stringify(strip(t,o))])),now=new Map(S[t].map(o=>[o.id,o]));
  const up=S[t].filter(o=>old.get(o.id)!==JSON.stringify(strip(t,o))).map(o=>strip(t,o));
  const del=[...old.keys()].filter(id=>!now.has(id));
  if(up.length){const r=await sb.from(t).upsert(up);if(r.error)errs.push(r.error.message)}
  if(del.length){const r=await sb.from(t).delete().in('id',del);if(r.error)errs.push(r.error.message)}
 }
 const nf=S.folders.filter(f=>!last.folders.includes(f));
 if(nf.length){const r=await sb.from('folders').insert(nf.map(name=>({name})));if(r.error)errs.push(r.error.message)}
 const ou=new Map(last.users.map(u=>[u.id,u]));
 for(const u of S.users){const o=ou.get(u.id);if(!o)continue;
  if(o.role!==u.role){const r=await sb.from('profiles').update({role:u.role,team:u.team}).eq('id',u.id);if(r.error)errs.push(r.error.message)}
  else if(o.team!==u.team){const r=await sb.rpc('set_team',{uid:u.id,tm:u.team});if(r.error)errs.push(r.error.message)}}
 const gone=last.users.filter(u=>!S.users.find(x=>x.id===u.id)).map(u=>u.id);
 if(gone.length){const r=await sb.from('profiles').delete().in('id',gone);if(r.error)errs.push(r.error.message)}
 try{await load()}catch(e){errs.push(e.message)}
 if(me)me=S.users.find(u=>u.id===me.id)||me;
 if(errs.length)alert('Alcune modifiche non sono state salvate (permessi insufficienti o errore):\n'+errs.join('\n'));
 if(!modal&&!(document.activeElement&&document.activeElement.id==='mmin'))render();
}

 const t=id?JSON.parse(JSON.stringify(S.tasks.find(x=>x.id===id))):{t:'',team:me.team||'MK',req:null,own:me.role==='member'?me.id:null,s:iso(TODAY),e:iso(new Date(TODAY.getTime()+14*864e5)),p:0,dep:null,asg:[],c:[]};

function collect(){const t=modal.t,g=id=>document.getElementById(id);
 if(g('ft'))t.t=g('ft').value;if(g('fown'))t.own=g('fown').value||null;if(g('fs'))t.s=g('fs').value;if(g('fe'))t.e=g('fe').value;if(g('fdep'))t.dep=g('fdep').value?+g('fdep').value:null;if(g('fasgbox'))t.asg=[...document.querySelectorAll('.fasg:checked')].map(i=>i.value).filter(v=>v!==t.own);if(g('fc'))modal.draft=g('fc').value}
function saveTask(){collect();const t=modal.t;if(!t.t.trim())return alert('Inserisci un titolo');if(t.e<t.s)return alert('La scadenza precede l\'inizio');
 if(!t.id&&me.team&&t.team!==me.team){t.req=me.team;t.own=null;t.asg=[]}
 if(!t.own&&(t.asg||[]).length)return alert('Scegli un owner prima di aggiungere altre persone.');
 if(!t.id){t.id=nid(S.tasks);if(!CLOUD)t.num=Math.max(0,...S.tasks.map(x=>x.num||0))+1;S.tasks.push(t);
  if(modal.fromSug){const g=S.suggestions.find(x=>x.id===modal.fromSug);if(g){g.status='accepted';g.task_id=t.id;g.decided_by=me.id}}}
 else S.tasks[S.tasks.findIndex(x=>x.id===t.id)]=t;save();closeM()}
function takeTask(){const o=S.tasks.find(x=>x.id===modal.t.id);o.own=me.id;o.asg=(o.asg||[]).filter(id=>id!==me.id);save();closeM()}

function delTaskById(id,fromModal){const t=S.tasks.find(x=>x.id===id);if(!t||!can.del(t))return;
 if(!confirm('Eliminare la task '+tnum(t)+' «'+t.t+'»?\nL\'operazione non si può annullare.'))return;
 S.tasks=S.tasks.filter(x=>x.id!==id);S.tasks.forEach(x=>{if(x.dep===id)x.dep=null});save();if(fromModal)closeM();else render()}
async function addComment(){const v=fc.value.trim();if(!v)return;collect();const o=S.tasks.find(x=>x.id===modal.t.id);
 if(CLOUD){const r=await sb.rpc('add_comment',{tid:o.id,txt:v});if(r.error)return alert(r.error.message);const lt=last.tasks.find(x=>x.id===o.id);o.c.push({u:me.id,x:v});if(lt)lt.c=clone(o.c);modal.t.c=o.c;modal.draft='';render();return}
 o.c.push({u:me.id,x:v});modal.t.c=o.c;modal.draft='';save();render()}
function commentHtml(c,i){
 if(modal.editC===i)return `<div class="cm"><small>${esc(U(c.u).name)}</small><textarea id="fce" style="margin-top:6px">${esc(c.x)}</textarea><div class="cmx"><button onclick="modal.editC=null;render()">Annulla</button><button class="btn sm" onclick="saveComment(${i})">Salva</button></div></div>`;
 const ed=can.editC(c),dl=can.delC(c);
 return `<div class="cm"><small>${esc(U(c.u).name)}${c.edited?' · modificato':''}</small><div>${esc(c.x)}</div>${ed||dl?`<div class="cmx">${ed?`<button onclick="editComment(${i})">Modifica</button>`:''}${dl?`<button class="del" onclick="delComment(${i})">Elimina</button>`:''}</div>`:''}</div>`}
function editComment(i){collect();modal.editC=i;render();setTimeout(()=>{const e=document.getElementById('fce');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}})}
async function saveComment(i){const v=document.getElementById('fce').value.trim();if(!v)return alert('Il commento non può essere vuoto.');collect();
 const o=S.tasks.find(x=>x.id===modal.t.id),c=o.c[i];if(!c||!can.editC(c))return;
 if(v!==c.x){if(CLOUD){const r=await sb.rpc('edit_comment',{tid:o.id,idx:i,old_txt:c.x,new_txt:v});if(r.error)return alert(r.error.message)}c.x=v;c.edited=true}
 const lt=CLOUD&&last.tasks.find(x=>x.id===o.id);if(lt)lt.c=clone(o.c);modal.t.c=o.c;modal.editC=null;if(!CLOUD)save();render()}
async function delComment(i){if(!confirm('Eliminare questo commento?'))return;collect();
 const o=S.tasks.find(x=>x.id===modal.t.id),c=o.c[i];if(!c||!can.delC(c))return;
 if(CLOUD){const r=await sb.rpc('delete_comment',{tid:o.id,idx:i,old_txt:c.x});if(r.error)return alert(r.error.message)}
 o.c.splice(i,1);const lt=CLOUD&&last.tasks.find(x=>x.id===o.id);if(lt)lt.c=clone(o.c);modal.t.c=o.c;modal.editC=null;if(!CLOUD)save();render()}
function openEvent(id,d){const e=id?{...S.events.find(x=>x.id===id)}:{t:'',d:d||iso(TODAY),h:'18:30',where:'',team:isSA()?null:me.team,desc:''};if(!id&&!can.event())return;modal={type:'event',e};render()}
function saveEvent(){const e=modal.e;Object.assign(e,{t:et.value.trim(),d:ed.value,h:eh.value,where:ew.value,team:etm.value||null,desc:eds.value});if(!e.t)return alert('Inserisci un titolo');
 if(e.id)S.events[S.events.findIndex(x=>x.id===e.id)]=e;else{e.id=nid(S.events);S.events.push(e)}save();closeM()}
async function uploadFile(){const f=uf.files[0],l=ul.value.trim();if(!f&&!l)return alert('Seleziona un file o inserisci un link');
 let url=l||null;
 if(f&&CLOUD){if(f.size>50e6)return alert('Massimo 50 MB per file.');
  const path=`${uv.value||'ALL'}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;
  const r=await sb.storage.from('files').upload(path,f);if(r.error)return alert('Caricamento non riuscito: '+r.error.message);url='sb:'+path}
 S.files.unshift({id:nid(S.files),n:f?f.name:l.split('/').pop()||'Link',url,f:ufo.value,team:uv.value||null,by:me.id,d:iso(TODAY),sz:f?(f.size>1e6?(f.size/1e6).toFixed(1).replace('.',',')+' MB':Math.ceil(f.size/1e3)+' KB'):'link'});save();closeM()}
function saveMeeting(){const t=mt.value.trim();if(!t)return alert('Inserisci un titolo');const teams=[...document.querySelectorAll('.mtm:checked')].map(i=>i.value);if(!teams.length)return alert('Scegli almeno un team');
 const ev={id:nid(S.events),t,d:md.value,h:mh.value,where:mw.value,team:teams.length===1?teams[0]:null,desc:'Meeting'};S.events.push(ev);
 const m={id:nid(S.meetings),t,ev:ev.id,teams,fixed:[],order:[]};S.meetings.push(m);selMeeting=m.id;save();closeM()}
function addMember(){if(mu.value){const u=S.users.find(x=>x.id===mu.value);u.team=modal.team;if(u.role==='guest'&&isSA())u.role='member'}else if(mn.value.trim()&&me2.value.trim()){if(CLOUD)return invite(mn.value.trim(),me2.value.trim(),'member',modal.team);S.users.push({id:'u'+Date.now(),name:mn.value.trim(),ini:ini(mn.value),email:me2.value.trim(),role:'member',team:modal.team})}else return alert('Scegli un utente o inserisci nome ed email');save();closeM()}
function removeFromTeam(id){const u=S.users.find(x=>x.id===id);if(confirm('Rimuovere '+u.name+' dal team?')){u.team=null;save();render()}}
function setUser(id,k,v){const u=S.users.find(x=>x.id===id);u[k]=v;if(k==='role'&&['guest','superadmin'].includes(v))u.team=null;save();render()}
function delUser(id){if(!confirm('Eliminare l\'utente?'))return;S.users=S.users.filter(u=>u.id!==id);save();render()}
function newUser(){const n=nn2.value.trim(),e=ne.value.trim();if(!n||!e)return alert('Nome ed email obbligatori');
 if(CLOUD)return invite(n,e,nr.value,['guest','superadmin'].includes(nr.value)?null:(nt.value||null));
 S.users.push({id:'u'+Date.now(),name:n,ini:ini(n),email:e,role:nr.value,team:['guest','superadmin'].includes(nr.value)?null:(nt.value||null)});save();closeM()}
function openFile(id){const f=S.files.find(x=>x.id===id);if(f&&f.url)window.open(f.url,'_blank','noopener')}
/* ---------- impostazioni profilo ---------- */
const splitName=u=>{const p=(u.name||'').trim().split(/\s+/);return [p[0]||'',p.slice(1).join(' ')]};
function openSettings(){const n=splitName(me);modal={type:'settings',f:{first:me.first_name||n[0],last:me.last_name||n[1],email:me.email||'',phone:me.phone||'',team:me.team||''},photo:undefined};render()}
function setsCollect(){const g=id=>document.getElementById(id);if(!modal||modal.type!=='settings'||!g('sf1'))return;modal.f={first:g('sf1').value,last:g('sf2').value,email:g('sf3').value,phone:g('sf4').value,team:g('sf5').value}}
function pickPhoto(inp){const f=inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return alert('Scegli un\'immagine.');
 setsCollect();const rd=new FileReader();
 rd.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),sz=256,r=Math.min(img.width,img.height);c.width=c.height=sz;
  c.getContext('2d').drawImage(img,(img.width-r)/2,(img.height-r)/2,r,r,0,0,sz,sz);modal.photo=c.toDataURL('image/jpeg',.82);render()};
  img.onerror=()=>alert('Immagine non leggibile.');img.src=rd.result};rd.readAsDataURL(f)}
async function saveSettings(){setsCollect();const f=modal.f,first=f.first.trim(),last=f.last.trim(),email=f.email.trim(),phone=f.phone.trim();
 if(!first)return alert('Inserisci il nome.');
 if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return alert('Email non valida.');
 if(phone&&!/^[+0-9 ()\-./]{6,24}$/.test(phone))return alert('Telefono non valido: usa solo numeri, spazi e + ( ) - .');
 const name=(first+' '+last).trim(),photo=modal.photo,canTeam=isSA()||(me.role!=='guest'&&!me.team),newTeam=canTeam?(f.team||null):(me.team||null);
 if(!CLOUD){const u=S.users.find(x=>x.id===me.id);Object.assign(u,{name,ini:ini(name),first_name:first,last_name:last,email:email||u.email,phone});
  if(photo!==undefined)u.photo=photo;if(canTeam&&u.role!=='guest')u.team=newTeam;me=u;save();closeM();return}
 const errs=[];let msg='';
 if(!HAS_PROF)errs.push('Nome, telefono e foto richiedono la migrazione SQL 002 (cartella db/migrations): chiedi al superadmin di eseguirla.');
 else{const r=await sb.rpc('update_my_profile',{p_first:first,p_last:last,p_phone:phone,p_photo:photo===undefined?null:photo,p_set_photo:photo!==undefined});if(r.error)errs.push(r.error.message)}
 if(canTeam&&newTeam!==(me.team||null)){const r=await sb.rpc('set_my_team',{tm:newTeam});if(r.error)errs.push(r.error.message)}
 if(email&&email.toLowerCase()!==(me.email||'').toLowerCase()){const r=await sb.auth.updateUser({email});if(r.error)errs.push(r.error.message);else msg='Ti abbiamo inviato una mail di conferma al nuovo indirizzo: il cambio vale dopo la conferma.'}
 try{await load();me=S.users.find(u=>u.id===me.id)||me}catch(e){errs.push(e.message)}
 if(errs.length){render();return alert('Non tutto è stato salvato:\n'+errs.join('\n'))}
 closeM();if(msg)alert(msg)}

/* ---------- appunti riunione ---------- */
function minInput(id,v){minDraft[id]=v;const st=document.getElementById('minst');
 try{localStorage.setItem('tedx_min_'+id,v)}catch(e){}
 if(CLOUD&&!HAS_MIN){if(st)st.textContent='Non salvato (serve la migrazione 002)';return}
 if(st)st.textContent='Modifiche non salvate…';clearTimeout(minTimer);minTimer=setTimeout(()=>saveMinutes(id,true),2500)}
function saveMinutes(id,auto){const m=S.meetings.find(x=>x.id===id),el=document.getElementById('mmin');if(!m||!can.minutes())return;
 if(CLOUD&&!HAS_MIN){if(!auto)alert('Per salvare gli appunti serve la migrazione SQL 002 (cartella db/migrations).');return}
 clearTimeout(minTimer);const v=el?el.value:(minDraft[id]||'');minDraft[id]=v;
 if((m.minutes||'')!==v){m.minutes=v;save()}
 const st=document.getElementById('minst');if(st)st.textContent='Salvato ✓'}
function loadMinutes(id,inp){const f=inp.files[0];if(!f)return;if(f.size>2e6)return alert('File troppo grande (max 2 MB). Incolla solo la parte che serve.');
 const rd=new FileReader();rd.onload=()=>{const el=document.getElementById('mmin'),cur=el.value.trim();el.value=(cur?cur+'\n\n':'')+String(rd.result);minInput(id,el.value)};rd.readAsText(f)}
function buildPrompt(m,notes){const e=S.events.find(ev=>ev.id===m.ev),ag=agendaOf(m);
 const people=S.users.filter(u=>u.role!=='guest'&&u.team).map(u=>`- ${u.id} | ${u.name} | ${TEAMS[u.team].name} (${u.team}) | ${ROLES[u.role].l}`).join('\n')||'- (nessun membro nei team)';
 const tasks=S.tasks.map(t=>`- ${tnum(t)} ${t.t} [${t.team}] owner: ${t.own?U(t.own).name:'da assegnare'} (${t.s} → ${t.e})`).join('\n')||'- (nessuna)';
 return `Sei l'assistente di TEDxLerici HUB. Leggi gli appunti della riunione e proponi le task da creare.

Regole:
- Proponi solo task che emergono davvero dagli appunti e non duplicare quelle già esistenti.
- Se responsabile o scadenza non sono nel testo, lasciali a null: non inventarli.
- Scegli owner e altre persone SOLO dall'elenco membri, usando l'id esatto.
- "team" è uno tra MK, OP, PA, SP (in genere il team dell'owner).
- Date nel formato AAAA-MM-GG. "reason" è una frase breve che cita gli appunti.

RIUNIONE: ${m.t}${e?' — '+e.d+' '+e.h:''}
ORDINE DEL GIORNO:
${ag.map((p,i)=>`${i+1}. ${p.x}`).join('\n')||'(vuoto)'}

MEMBRI (id | nome | team | ruolo):
${people}

TASK GIÀ ESISTENTI:
${tasks}

APPUNTI (tra i due ---):
---
${notes}
---

Rispondi SOLO con un blocco JSON, senza altro testo, in questo formato:
{"tasks":[{"title":"...","team":"MK","owner":"<id membro o null>","others":["<id membro>"],"start":"AAAA-MM-GG o null","end":"AAAA-MM-GG o null","reason":"..."}]}`}
function askClaude(id){const m=S.meetings.find(x=>x.id===id),el=document.getElementById('mmin'),notes=(el?el.value:(minDraft[id]!==undefined?minDraft[id]:m.minutes||'')).trim();
 if(!notes)return alert('Scrivi o carica prima gli appunti della riunione.');
 if(el)minInput(id,el.value);modal={type:'claude',mid:id,prompt:buildPrompt(m,notes)};render()}
function copyPrompt(){const el=document.getElementById('cprompt');navigator.clipboard?.writeText(modal.prompt).then(()=>alert('Richiesta copiata: incollala nella chat con Claude.'),()=>{el.select();alert('Copia manuale: selezionata, premi Ctrl/Cmd+C.')})||(el.select(),alert('Copia manuale: premi Ctrl/Cmd+C.'))}
function importSug(mid){const raw=(document.getElementById('cjson').value||'').trim();if(!raw)return alert('Incolla la risposta di Claude.');
 if(CLOUD&&!HAS_SUG)return alert('Per salvare i suggerimenti serve la migrazione SQL 002 (cartella db/migrations).');
 let data;try{const a=raw.search(/[\[{]/),open=raw[a],b=raw.lastIndexOf(open==='['?']':'}');data=JSON.parse(raw.slice(a,b+1))}catch(e){return alert('Non riesco a leggere la risposta: incolla solo il blocco JSON di Claude.')}
 const arr=Array.isArray(data)?data:data.tasks;if(!Array.isArray(arr)||!arr.length)return alert('Nessuna task trovata nella risposta.');
 const uid=v=>{if(!v)return null;v=String(v).trim();const u=S.users.find(x=>String(x.id)===v)||S.users.find(x=>x.name.toLowerCase()===v.toLowerCase());return u&&u.role!=='guest'?u.id:null};
 const dt=v=>{v=String(v||'');return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v))?v:null};
 let n=0,skip=0;
 arr.slice(0,40).forEach(it=>{const title=String((it&&it.title)||'').trim().slice(0,160);if(!title)return;
  if(S.suggestions.some(g=>g.meeting===mid&&g.status==='pending'&&g.title.toLowerCase()===title.toLowerCase())){skip++;return}
  const own=uid(it.owner);let team=TEAMS[it.team]?it.team:null;if(own&&U(own).team)team=U(own).team;
  const asg=[...new Set((Array.isArray(it.others)?it.others:[]).map(uid).filter(x=>x&&x!==own))];
  let s0=dt(it.start),e0=dt(it.end);if(s0&&e0&&e0<s0)e0=null;
  S.suggestions.push({id:nid(S.suggestions),meeting:mid,title,team,own,asg,s:s0,e:e0,why:String(it.reason||'').trim().slice(0,300),status:'pending',by:me.id,task_id:null});n++});
 if(!n)return alert(skip?'Questi suggerimenti sono già in attesa di approvazione.':'Nessun suggerimento valido nella risposta.');
 save();closeM();alert(n+' suggerimenti aggiunti, in attesa di approvazione. Nessuna task è stata creata.')}
function acceptSug(id){const g=S.suggestions.find(x=>x.id===id);if(!g||!can.accept(g))return;
 const m=S.meetings.find(x=>x.id===g.meeting),e=m&&S.events.find(ev=>ev.id===m.ev),st=g.s||(e&&e.d>=iso(TODAY)?e.d:iso(TODAY));
 const t={t:g.title,team:g.team||me.team||'MK',req:null,own:g.own,s:st,e:g.e||iso(new Date(new Date(st).getTime()+14*864e5)),p:0,dep:null,asg:[...(g.asg||[])],c:[]};
 if(t.e<t.s)t.e=t.s;modal={type:'task',t,fromSug:id};render()}
function dismissSug(id){const g=S.suggestions.find(x=>x.id===id);if(!g||!can.accept(g))return;if(!confirm('Scartare il suggerimento «'+g.title+'»?'))return;g.status='dismissed';g.decided_by=me.id;save();render()}
boot();
